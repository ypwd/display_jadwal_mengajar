<body>
<div class="app">
<header class="top">
<div class="school"><img id="logo" class="logo" alt="Logo"><div style="min-width:0"><div id="schoolName" class="school-name">SMK WIDYA DIRGANTARA</div><div id="tagline" class="tagline">DISIPLIN • KOMPETEN • BERKARAKTER</div></div></div>
<div class="title"><h1><span>Informasi Jadwal</span><br>Mengajar Guru</h1><p id="day">MEMUAT...</p></div>
<div class="clock"><div id="clockTime" class="clock-time">00:00:00</div><div id="clockDate" class="clock-date">-</div></div>
</header>
<main class="content"><section class="board"><div id="fixedHead" class="fixed-head"></div><div id="scrollArea" class="scroll-area"><div id="track" class="track"></div></div></section></main>
<footer class="footer"><div class="footer-badge">INFORMASI JADWAL</div><div class="footer-message">Disiplin waktu • Siap mengajar • Pelayanan terbaik kepada siswa</div><div class="footer-update"><strong id="updateStatus">Memuat...</strong>Pembaruan otomatis</div></footer>
</div>
<script>
let DATA=null,animationId=null,scrolling=true,scrollStart=0,cycleHeight=0;
let tampilanAktif='A';

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function clock(){
  const d=new Date();
  document.getElementById('clockTime').textContent=
    d.toLocaleTimeString('id-ID',{
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hour12:false
    });
  document.getElementById('clockDate').textContent=
    d.toLocaleDateString('id-ID',{
      weekday:'long',
      day:'2-digit',
      month:'long',
      year:'numeric'
    });
}
clock();
setInterval(clock,1000);

/*
 * =====================================================
 * FRONTEND V2
 * DATA DIAMBIL DARI GAS BACKEND MELALUI JSONP
 * =====================================================
 *
 * Ganti URL di bawah dengan URL deployment backend V2.
 */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyp7hgvPXn19BrcIAUFDLhlMPvKeoWkxQ21lGgZZPQzUiaziM88CWh-E101joTUIPfmVw/exec';

function getData(){
  return new Promise((resolve,reject)=>{
    const callbackName =
      'jadwalCallback_' + Date.now() + '_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');
    let selesai = false;

    const bersihkan = ()=>{
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window[callbackName]; }catch(e){}
    };

    const timer = setTimeout(()=>{
      if(selesai) return;
      selesai = true;
      bersihkan();
      reject(new Error('Backend jadwal tidak merespons.'));
    }, 15000);

    window[callbackName] = payload=>{
      if(selesai) return;
      selesai = true;
      clearTimeout(timer);
      bersihkan();

      if(!payload || payload.ok !== true){
        reject(new Error(payload && payload.message
          ? payload.message
          : 'Data backend tidak valid.'));
        return;
      }

      resolve(payload.data);
    };

    script.onerror = ()=>{
      if(selesai) return;
      selesai = true;
      clearTimeout(timer);
      bersihkan();
      reject(new Error('Tidak dapat terhubung ke backend Google Apps Script.'));
    };

    script.src =
      BACKEND_URL +
      (BACKEND_URL.indexOf('?') >= 0 ? '&' : '?') +
      'action=display&callback=' +
      encodeURIComponent(callbackName) +
      '&_=' + Date.now();

    document.head.appendChild(script);
  });
}

function getSessionTime(sesi){
  const sessions = DATA && Array.isArray(DATA.sessions) ? DATA.sessions : [];
  const item = sessions.find(x => Number(x.no) === Number(sesi));

  if(!item) return '';

  const mulai = item.mulai || '';
  const selesai = item.selesai || '';

  if(mulai || selesai){
    return esc(mulai) + (selesai ? ' – ' + esc(selesai) : '');
  }

  return '';
}

function getKegiatanSesi(sesi){
  const sessions = DATA && Array.isArray(DATA.sessions) ? DATA.sessions : [];
  const item = sessions.find(x => Number(x.no) === Number(sesi));
  return item && Array.isArray(item.kegiatan) ? item.kegiatan : [];
}

/* =====================================================
   MENENTUKAN JAM MULAI SESI DARI TEKS JAM
   Contoh:
   "13:10 – 13:50" -> 13:10
   "13.10 – 13.50" -> 13:10
   ===================================================== */
function waktuKeMenit(waktu){
  if(!waktu) return null;

  const teks=String(waktu).replace('.',':');
  const match=teks.match(/(\d{1,2}):(\d{2})/);

  if(!match) return null;

  const jam=Number(match[1]);
  const menit=Number(match[2]);

  if(jam<0 || jam>23 || menit<0 || menit>59) return null;

  return jam*60+menit;
}

/* =====================================================
   ATURAN TAMPILAN

   A = JAM 1  sampai JAM 9
   B = JAM 10 sampai JAM 17

   Pergantian mengikuti JAM MULAI SESI 10.
   Tidak ada batas waktu yang ditulis manual.
   ===================================================== */
function tentukanTampilan(){
  if(!DATA) return 'A';

  const waktuJam10=getSessionTime(10);
  const mulaiJam10=waktuKeMenit(waktuJam10);

  if(mulaiJam10===null){
    return 'A';
  }

  const sekarang=new Date();
  const menitSekarang=
    sekarang.getHours()*60+
    sekarang.getMinutes();

  return menitSekarang>=mulaiJam10 ? 'B' : 'A';
}

function getRentangSesi(){
  const tampilan=tentukanTampilan();

  if(tampilan==='A'){
    return {mulai:1,selesai:9};
  }

  return {mulai:10,selesai:17};
}

function renderHeader(){
  const rentang=getRentangSesi();

  let h=
    '<table><thead><tr>' +
    '<th>NAMA GURU</th>' +
    '<th>FOTO</th>' +
    '<th>MATA PELAJARAN</th>';

  for(let i=rentang.mulai;i<=rentang.selesai;i++){
    const waktu=getSessionTime(i);

    const kegiatan = getKegiatanSesi(i);
    const judulSesi = kegiatan.length ? kegiatan.join(' • ') : 'JAM '+i;

    h+=
      '<th>' +
        '<div class="session-title">'+esc(judulSesi)+'</div>' +
        '<span class="session-time">'+waktu+'</span>' +
      '</th>';
  }

  h+='</tr></thead></table>';

  document.getElementById('fixedHead').innerHTML=h;
}

const warnaKelasRuang=[
  '#DCEEFF','#DFF4E5','#FFF0CC','#EAE1FF',
  '#DDF5F5','#FFE1E8','#E8EDF3','#E6F3E8',
  '#F4E7D3','#E1E8FF','#E8F0D8','#F3E2F0'
];
const petaWarnaKelasRuang={};

function kunciKelasRuang(item){
  return String(item?.kelas||'').trim().toUpperCase()+'|'+
         String(item?.ruang||'').trim().toUpperCase();
}

function warnaUntukKelasRuang(item){
  const key=kunciKelasRuang(item);
  if(!key || key==='|') return '#F4F6F8';
  if(!(key in petaWarnaKelasRuang)){
    const n=Object.keys(petaWarnaKelasRuang).length;
    petaWarnaKelasRuang[key]=warnaKelasRuang[n%warnaKelasRuang.length];
  }
  return petaWarnaKelasRuang[key];
}

function isiJadwal(item){
  if(!item){
    return '<div class="empty">—</div>';
  }

  const mapel = esc(item.mapel || item.mataPelajaran || '-');
  const kelas = esc(item.kelas || '-');
  const ruang = esc(item.ruang || '-');

  return (
    '<div class="merged-class">' +
      '<div class="cell-mapel">' + mapel + '</div>' +
      '<div class="lesson">' + kelas + '</div>' +
      '<div class="room">' + ruang + '</div>' +
    '</div>'
  );
}

function itemSesi(guru,sesi){
  const items=guru.sesi&&guru.sesi[sesi]?guru.sesi[sesi]:[];
  if(!items||!items.length) return null;
  if(items.length!==1) return {multi:true,items:items};
  return items[0];
}


/* ===== DATA GURU DARI APPS SCRIPT =====
   Apps Script mengirim DATA.teachers.
   Setiap guru sudah menjadi satu objek guru sendiri.
*/
function normalisasiGuruTV(g){
  return {
    namaGuru: g.nama || '',
    foto: g.foto || '',
    mataPelajaran: Array.isArray(g.mapel) ? g.mapel : (g.mapel ? [g.mapel] : []),
    sesi: g.sesi || {}
  };
}

function semuaGuruTV(){
  if(Array.isArray(DATA.teachers)){
    return DATA.teachers.map(normalisasiGuruTV);
  }

  /* Kompatibilitas dengan data lama jika masih ada. */
  if(Array.isArray(DATA.guru)){
    return DATA.guru;
  }

  return [];
}

function guruAdaJadwalPadaRentang(guru, mulai, selesai){
  for(let s = mulai; s <= selesai; s++){
    const items = guru.sesi && guru.sesi[s] ? guru.sesi[s] : [];
    if(items && items.length) return true;
  }
  return false;
}

function renderBody(){
  const semuaGuru = semuaGuruTV();
  const rentang = getRentangSesi();

  /*
    Hanya tampilkan guru yang memiliki minimal satu jadwal
    pada rentang sesi yang sedang aktif.
  */
  const teachers = semuaGuru.filter(g =>
    guruAdaJadwalPadaRentang(g, rentang.mulai, rentang.selesai)
  );

  if(!teachers.length){
    document.getElementById('track').innerHTML =
      '<div class="empty" style="padding:50px;text-align:center">' +
      'Tidak ada guru yang mengajar pada rentang sesi ini.' +
      '</div>';
    return;
  }

  let h='<table class="data-table"><tbody>';

  /*
    Kegiatan khusus tetap ditampilkan walaupun tidak ada guru.
  */
  for(let s=rentang.mulai; s<=rentang.selesai; s++){
    const kegiatan = getKegiatanSesi(s);
    if(!kegiatan.length) continue;

    h += '<tr class="activity-row">' +
      '<td colspan="'+(3 + (rentang.selesai-rentang.mulai+1))+'">' +
        '<div class="activity-title">'+
          esc(kegiatan.join(' • '))+
        '</div>' +
      '</td>' +
    '</tr>';
  }

  teachers.forEach(g=>{
    h+='<tr>'+
      '<td><div class="teacher-name">'+esc(g.namaGuru)+'</div></td>'+
      '<td>'+
        (g.foto
          ? '<img class="teacher-photo" src="'+esc(g.foto)+
            '" onerror="this.outerHTML=\'<div class=no-photo>👤</div>\'">'
          : '<div class="no-photo">👤</div>')+
      '</td>'+
      '<td><div class="subject">'+
        esc(
          Array.isArray(g.mataPelajaran)
            ? g.mataPelajaran.join(' / ')
            : String(g.mataPelajaran || '-')
        )+
      '</div></td>';

    let s=rentang.mulai;

    while(s<=rentang.selesai){
      const item=itemSesi(g,s);

      if(!item){
        h+='<td class="schedule-empty"><div class="empty">—</div></td>';
        s++;
        continue;
      }

      if(item.multi){
        h+='<td class="schedule-cell multi-schedule">'+
          item.items.map(x=>
            '<div class="cell-mapel">'+esc(x.mapel||x.mataPelajaran||'-')+'</div>'+
            '<div class="lesson">'+esc(x.kelas||'-')+'</div>'+
            '<div class="room">'+esc(x.ruang||'-')+'</div>'
          ).join('<div class="schedule-gap"></div>')+
          '</td>';
        s++;
        continue;
      }

      let panjang=1;

      while(s+panjang<=rentang.selesai){
        const next=itemSesi(g,s+panjang);
        if(!next || next.multi) break;
        if(kunciKelasRuang(item)!==kunciKelasRuang(next)) break;
        panjang++;
      }

      h+='<td class="schedule-cell merged-schedule" colspan="'+panjang+
        '" style="background:'+warnaUntukKelasRuang(item)+'">'+
        isiJadwal(item)+'</td>';

      s+=panjang;
    }

    h+='</tr>';
  });

  h+='</tbody></table>';

  /*
    Duplikasi tabel tetap dipertahankan untuk mekanisme scrolling
    yang sudah berjalan sebelumnya.
  */
  document.getElementById('track').innerHTML=h+h;
}

function startScroll(){
  if(animationId) cancelAnimationFrame(animationId);

  const area=document.getElementById('scrollArea');
  const tables=document.getElementById('track').querySelectorAll('table');

  if(tables.length<2) return;

  cycleHeight=tables[0].offsetHeight;

  if(cycleHeight<=area.clientHeight){
    document.getElementById('track').style.transform='translateY(0)';
    return;
  }

  scrollStart=performance.now();
  const speed=5;

  function step(now){
    if(scrolling){
      const y=((now-scrollStart)/1000*speed)%cycleHeight;
      document.getElementById('track').style.transform=
        'translateY(-'+y+'px)';
    }

    animationId=requestAnimationFrame(step);
  }

  animationId=requestAnimationFrame(step);
}

/* =====================================================
   MEMERIKSA PERGANTIAN TAMPILAN BERDASARKAN JAM NYATA
   Diperiksa setiap 5 detik tanpa mengambil data baru.
   ===================================================== */
function periksaPergantianTampilan(){
  if(!DATA) return;

  const tampilanBaru=tentukanTampilan();

  if(tampilanBaru!==tampilanAktif){
    tampilanAktif=tampilanBaru;

    renderHeader();
    renderBody();

    document.getElementById('track').style.transform='translateY(0)';
    requestAnimationFrame(startScroll);
  }
}

async function loadDisplay(){
  try{
    DATA=await getData();

    document.getElementById('schoolName').textContent=
      DATA.sekolah||'SMK WIDYA DIRGANTARA';

    document.getElementById('tagline').textContent=
      DATA.tagline||'DISIPLIN • KOMPETEN • BERKARAKTER';

    document.getElementById('day').textContent=
      String(DATA.hari||'').toUpperCase();

    if(DATA.logoUrl){
      document.getElementById('logo').src=DATA.logoUrl;
    }

    /* Pastikan status awal mengikuti jam nyata. */
    tampilanAktif=tentukanTampilan();

    renderHeader();
    renderBody();

    document.getElementById('updateStatus').textContent=
      'Terakhir '+
      new Date().toLocaleTimeString('id-ID',{
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      });

    requestAnimationFrame(startScroll);

  }catch(e){
    document.getElementById('track').innerHTML=
      '<div style="padding:50px;text-align:center;color:#a22;font-weight:900">' +
      'Gagal membaca data jadwal<br>' +
      '<small>'+esc(e.message||e)+'</small></div>';
  }
}

document.getElementById('scrollArea').addEventListener(
  'mouseenter',
  ()=>scrolling=false
);

document.getElementById('scrollArea').addEventListener(
  'mouseleave',
  ()=>{
    scrolling=true;
    scrollStart=performance.now();
  }
);

window.addEventListener(
  'resize',
  ()=>requestAnimationFrame(startScroll)
);

/* Ambil data awal. */
loadDisplay();

/* Periksa pergantian A <-> B setiap 5 detik. */
setInterval(periksaPergantianTampilan,5000);

/* Ambil data jadwal terbaru setiap 60 detik. */
setInterval(loadDisplay,60000);
</script>
